services:
  # ==========================================
  # 1. DATABASE: PostgreSQL 16 (Metadata & Governance)
  # ==========================================
  postgres:
    image: postgres:16.15-alpine
    container_name: datia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-democratizacion_metadatos}
    # Port NOT published: the backend reaches Postgres over datia-network.
    # Uncomment only to attach a host-side client (pgAdmin, psql):
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-democratizacion_metadatos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datia-network

  # ==========================================
  # 2. BACKEND: FastAPI & Local Text-to-SQL Engine
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      # ':?' makes compose refuse to start when these are missing, instead of
      # falling back to a key that is published in the README and .env.example.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - copy it from .env}
      # Required in Docker: a key regenerated per boot leaves previously
      # encrypted columns undecryptable, and that only surfaces mid-query.
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY is required - generate one with 'python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"'}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-democratizacion_metadatos}
      # Default apagado para instalaciones cliente: sin seed demo no hay cuentas
      # con claves conocidas. Las maquinas demo ponen DEMO_MODE=true en su .env
      # local y compose lo interpola aca.
      - DEMO_MODE=${DEMO_MODE:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # central: la empresa administra el motor; user: el cliente puede apuntar
      # su propio LLM (validado por el backend). Sin valor, production cae en
      # central. El compose de desarrollo explicita el default para que no
      # dependa de ENVIRONMENT.
      - LLM_MODE=${LLM_MODE:-central}
      # Fijo, sin ${...}: dentro de un contenedor `localhost` es el PROPIO
      # contenedor, así que heredar el OLLAMA_BASE_URL=http://localhost:11434
      # que trae .env (correcto para `npm run dev` sin Docker) dejaba al backend
      # hablando consigo mismo. El síntoma era el chat respondiendo "IA local no
      # disponible" con Ollama corriendo en la máquina. La variable de .env
      # sigue sirviendo para correr sin Docker; acá no aplica.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - TEMP_PASSWORD_TTL_DAYS=${TEMP_PASSWORD_TTL_DAYS:-7}
    # Sin `ports`: el backend solo se alcanza por la red interna de compose, a
    # traves del proxy de nginx. Publicar 8000:8000 lo dejaba accesible desde la
    # LAN salteando el frontend y su rate limiting.
    volumes:
      - data_sources_data:/app/data_sources
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - datia-network

  # ==========================================
  # 3. FRONTEND: React SPA & Nginx Reverse Proxy
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # VITE_* se hornea en build-time: sin esto la imagen no-demo muestra el
      # desplegable igual. La maquina demo pone VITE_DEMO_MODE=true en su .env.
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        # Relativo y fijo: nginx hace proxy de /api/ al backend. No se interpola
        # desde .env porque el `.env` de desarrollo apunta a 127.0.0.1:8000 y esa
        # URL quedaria horneada en la imagen, rota para el navegador del cliente.
        VITE_API_BASE_URL: /api/v1
    container_name: datia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Solo loopback del host. En Docker Desktop/Windows la publicacion en
      # 0.0.0.0 exponia la app a toda la LAN. El contenedor escucha en 8080
      # porque nginx corre sin privilegios.
      - "127.0.0.1:80:8080"
      - "127.0.0.1:5173:8080"
    networks:
      - datia-network

volumes:
  postgres_data:
    driver: local
  data_sources_data:
    driver: local

networks:
  datia-network:
    driver: bridge
