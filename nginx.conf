# Rate limiting por IP. En el compose de produccion nginx es el unico punto de
# entrada publicado; el backend y PostgreSQL no publican puertos.
#
# `auth` es lento a proposito: bcrypt es costoso por intento y un atacante no
# debe poder probar claves a 20 req/s. `api` es holgado porque una sesion
# legitima pide varios endpoints en paralelo (dashboard, chat, catalogos).
limit_req_zone $binary_remote_addr zone=datia_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=datia_api:10m rate=20r/s;

server {
    # La imagen es `nginx-unprivileged`: no puede escuchar en 80.
    listen 8080;
    server_name _;

    server_tokens off;
    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    # Solo se confia en el proxy que la empresa ponga delante (Caddy del compose
    # o el LB/ingress). El entrypoint sustituye ${TRUSTED_PROXY_CIDR}; el default
    # de la imagen es 127.0.0.1, o sea "no confiar en nadie". Sin esto, cualquier
    # cliente podria mandar X-Forwarded-For y evadir el rate limit.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Subidas de bases enteras (SQLite, Excel, CSV, dumps SQL): el default de 1m
    # las rechazaba con 413 antes de que FastAPI las viera.
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # CSP alineada con lo que el SPA carga de verdad:
    #  - el tema se aplica con un <script> inline antes del primer paint;
    #  - la tipografia viene de Google Fonts (index.html);
    #  - el SPA solo habla con el backend por `/api/`, mismo origen. Ya no hay
    #    fetch directo del navegador a puertos del LLM: el backend es el punto
    #    de control (RBAC, auditoria, allowlist).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Healthcheck del contenedor. No pasa por el SPA.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash en el nombre: cache larga. `expires` no es `add_header`,
    # asi que los headers de seguridad del server se heredan (un add_header en
    # el location los reemplazaria y los .js/.css saldrian sin CSP).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
    }

    # El index no se cachea: un deploy nuevo tiene que verse al recargar.
    location = /index.html {
        expires -1;
    }

    # Login y cambio de contraseña: los endpoints que verifican una clave.
    # Va antes de `/api/` y como regex para que no herede el limite holgado.
    location ~ ^/api/v1/auth/(login|change-password)$ {
        limit_req zone=datia_auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr ya es la IP real si el proxy de delante esta en
        # TRUSTED_PROXY_CIDR. Se reemplaza la cadena, no se concatena: un
        # X-Forwarded-For que manda el cliente no se propaga.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=datia_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # Una consulta con LLM local y autocorreccion pasa de 60 s con facilidad.
        proxy_read_timeout 300s;
        # Conectar al backend es local: 10 s es margen de sobra. El timeout
        # largo va en lectura/escritura, no en el connect.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # `/api/v1/chat/query/stream` es SSE. Sin esto nginx acumula la respuesta
        # y el frontend recibe el stream de golpe al final.
        proxy_buffering off;
    }

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
