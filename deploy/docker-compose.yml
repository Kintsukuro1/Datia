# =============================================================================
# Datia - instalacion on-prem de UNA empresa (single-tenant).
#
# El cliente recibe este bundle y las imagenes de GHCR. No recibe el repositorio
# de codigo. PostgreSQL es la unica base corporativa; los datos que sube el
# cliente viven en el volumen `data_sources`.
#
#   docker compose up -d --wait
#
# Con TLS propio (Caddy opcional para una VM con dominio):
#   docker compose --profile caddy up -d --wait
#
# Los unicos puertos publicados son el frontend (loopback por defecto) y, con
# el perfil caddy, 80/443. El backend, PostgreSQL y Ollama NO publican puertos.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-datia}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Metadata corporativa. El backend la inicializa al arrancar (esquema, roles
  # y permisos). No se publica: solo la alcanza el backend por `internal`.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ evita que Compose interpole las variables: las expande el shell del
      # contenedor, donde POSTGRES_* si existen.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Motor LLM central. La empresa puede reemplazarlo por un Ollama en otro
  # contenedor del host, otra maquina de la LAN o un gateway compatible:
  #   - cambie OLLAMA_BASE_URL en .env
  #   - deje LLM_MODE=central o external
  # El backend sigue siendo el unico que ejecuta SQL, valida permisos y audita.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    environment:
      # Mantiene el modelo cargado entre consultas. En una VM con poca RAM,
      # bajelo a 5m o 0.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Una request a la vez: el backend ya serializa el uso del LLM y mas
      # paralelismo solo multiplica la RAM.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # API FastAPI. Sin puerto publicado: nginx la alcanza por `internal`.
  # ---------------------------------------------------------------------------
  backend:
    image: ${DATIA_BACKEND_IMAGE:?DATIA_BACKEND_IMAGE is required (release tag or digest)}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8000"
      # `:?` hace que compose se niegue a arrancar sin estos secretos, en vez de
      # caer en el valor por defecto publicado en el repositorio.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - run setup.sh}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is required - run setup.sh}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Sin cuentas demo ni claves publicadas. El primer admin se crea por CLI.
      DEMO_MODE: "false"
      # central = Ollama del compose; external = endpoint administrado por la
      # empresa; user = la empresa habilita el LLM propio por usuario.
      LLM_MODE: ${LLM_MODE:-central}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OPENAI_COMPATIBLE_URL: ${OPENAI_COMPATIBLE_URL:-http://localhost:1234/v1}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-32768}
      # El SPA habla con nginx en el mismo origen; CORS no se ejerce. Se deja
      # restringido por si la empresa publica la API detras de otro dominio.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      TEMP_PASSWORD_TTL_DAYS: ${TEMP_PASSWORD_TTL_DAYS:-7}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    volumes:
      - data_sources:/app/data_sources
    # Necesario solo si OLLAMA_BASE_URL apunta a un Ollama que corre en el host
    # fuera de este compose (`host.docker.internal`). En Docker Desktop ya
    # existe; en Linux esta linea lo agrega.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # SPA + nginx. Publica solo loopback por defecto: la empresa pone delante su
  # LB/ingress, o habilita el perfil caddy. El contenedor escucha en 8080
  # porque nginx corre sin privilegios.
  # ---------------------------------------------------------------------------
  frontend:
    image: ${DATIA_FRONTEND_IMAGE:?DATIA_FRONTEND_IMAGE is required (release tag or digest)}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DATIA_BIND_IP:-127.0.0.1}:${DATIA_HTTP_PORT:-8080}:8080"
    environment:
      # CIDR del proxy de delante (Caddy o el LB de la empresa). nginx solo
      # confia en X-Forwarded-For si viene de aca; si no, usa la IP del socket.
      # 172.30.0.0/24 es la subred `edge` de este compose.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.30.0.0/24}
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # TLS opcional para una VM con dominio publico/interno. Si la empresa ya
  # tiene LB/ingress con TLS, NO active este perfil.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      # Vacio si el perfil no esta activo; preflight exige el dominio cuando
      # COMPOSE_PROFILES incluye `caddy`.
      DATIA_DOMAIN: ${DATIA_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  data_sources:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  # Red de borde: Caddy y el frontend. El frontend tambien esta en `internal`
  # para alcanzar el backend. El backend NO esta en `edge`.
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Red de datos: backend, PostgreSQL y Ollama. Sin puertos publicados.
  internal:
    ipam:
      config:
        - subnet: 172.30.1.0/24
