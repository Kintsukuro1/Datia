# Solo configuracion de pytest: el backend no se empaqueta ni se instala como
# distribucion (CI y Docker instalan desde requirements.txt). El bloque
# [project]/[build-system] que habia aca era metadata muerta y ademas apuntaba
# a un `backend/README.md` inexistente. No re-agregarlo sin un consumidor real.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
