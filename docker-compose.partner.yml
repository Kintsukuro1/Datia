# ==========================================
# OVERRIDE para la maquina del compañero.
#
# En vez de `build:` tira de las imágenes ya construidas en Docker Hub, así que
# no necesita Node, ni Python, ni npm. Solo `docker compose up -d`.
#
#   docker compose -f docker-compose.yml -f docker-compose.partner.yml up -d
#
# (el compose base va primero: este archivo solo lo pisa, no lo reemplaza)
#
# La primera vez baja ~310 MB. Después usa la copia local.
#
# Los tres tags viven en el mismo repositorio:
#   https://hub.docker.com/r/k1ntsu/dat.ia
# ==========================================

services:
  backend:
    image: k1ntsu/dat.ia:backend
    build: !reset null

  frontend:
    image: k1ntsu/dat.ia:frontend
    build: !reset null

  postgres:
    image: k1ntsu/dat.ia:postgres
